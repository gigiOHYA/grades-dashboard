<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班級經營｜加減分</title>
<style>
  :root{
    --paper:#FFF6EC;
    --paper-line:#FFE3C2;
    --ink:#3A2E27;
    --ink-soft:#8A7A6E;
    --pink:#FF6B81;
    --pink-soft:#FFE1E6;
    --mint:#2FBF9F;
    --mint-soft:#D8F7EF;
    --card:#FFFFFF;
    --gold:#FFB627;
    --sky:#5AB4E0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background-color:var(--paper);
    background-image: radial-gradient(rgba(0,0,0,0.06) 1.6px, transparent 1.6px);
    background-size: 22px 22px;
    color:var(--ink);
    font-family: "Microsoft JhengHei","PingFang TC","Noto Sans TC",-apple-system,sans-serif;
    line-height:1.5;
    min-height:100vh;
    transition: background-color 0.6s ease;
  }
  .wrap{max-width:980px;margin:0 auto;padding:36px 20px 80px;}

  header{margin-bottom:28px;}
  .eyebrow{
    display:inline-block;font-size:13px;color:#fff;background:var(--mint);
    border-radius:20px;padding:4px 14px;font-weight:800;
    transform:rotate(-2deg);margin-bottom:10px;
  }
  h1{font-size:34px;margin:0 0 6px;font-weight:800;letter-spacing:0.5px;}
  header p{margin:0;color:var(--ink-soft);font-size:14.5px;}

  nav.tabs{display:flex;gap:8px;margin:26px 0 16px;flex-wrap:wrap;}
  nav.tabs button{
    font-family:inherit;font-size:16px;font-weight:800;background:var(--card);
    border:none;border-radius:20px;
    padding:10px 22px;cursor:pointer;color:var(--ink-soft);
    box-shadow:0 2px 0 var(--paper-line);
  }
  nav.tabs button.active{background:var(--mint);color:#fff;box-shadow:0 3px 0 #1f9b81;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .toolbar .status{font-size:12.5px;color:var(--ink-soft);}
  .toolbar .refresh{
    font-family:inherit;font-size:13px;font-weight:800;background:var(--card);
    border:none;border-radius:20px;padding:8px 16px;cursor:pointer;color:var(--ink-soft);
    box-shadow:0 2px 0 var(--paper-line);
  }

  .panel{background:transparent;border:none;padding:0;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
  .stu-card{
    background:var(--card);border:none;border-radius:20px;
    padding:14px 14px 12px;position:relative;
    box-shadow:0 4px 0 var(--paper-line);
  }
  .stu-card .rank{
    position:absolute;top:-10px;left:-10px;width:26px;height:26px;border-radius:50%;
    background:var(--gold);color:#fff;font-size:12px;font-weight:800;
    display:flex;align-items:center;justify-content:center;border:2px solid var(--card);
    box-shadow:0 2px 0 #d99315;
  }
  .stu-card .seat{
    font-size:30px;font-weight:800;color:var(--sky);line-height:1;margin-bottom:2px;
  }
  .stu-card .name{font-size:16px;font-weight:800;margin:0 0 8px;}
  .stu-card .total{font-size:24px;font-weight:800;}
  .stu-card .total.pos{color:var(--mint);}
  .stu-card .total.neg{color:var(--pink);}
  .stu-card .total.zero{color:var(--ink-soft);}
  .stu-card .actions{display:flex;gap:6px;margin-top:10px;}
  .stu-card .actions button{
    flex:1;font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;
    border-radius:14px;padding:7px 0;border:none;background:var(--paper);color:var(--ink-soft);
  }
  .stu-card .actions button.primary{background:var(--mint);color:#fff;}

  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(58,46,39,0.45);
    align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:var(--card);border:none;border-radius:24px;
    padding:26px;width:100%;max-width:420px;max-height:85vh;overflow:auto;position:relative;
    box-shadow:0 8px 0 var(--paper-line);
  }
  .modal-box h3{margin:0 0 4px;font-size:20px;padding-right:30px;font-weight:800;}
  .modal-box .modal-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;}
  .modal-close{
    position:absolute;top:16px;right:16px;width:32px;height:32px;
    border:none;border-radius:50%;background:var(--paper);
    cursor:pointer;font-size:15px;font-weight:800;line-height:1;color:var(--ink);
  }

  .cat-list{display:flex;flex-direction:column;gap:9px;}
  .cat-btn{
    display:flex;justify-content:space-between;align-items:center;
    font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;
    border-radius:16px;padding:12px 16px;border:none;background:var(--paper);color:var(--ink);
    text-align:left;
  }
  .cat-btn .pts{font-size:14px;font-weight:800;border-radius:14px;padding:3px 12px;}
  .cat-btn.pos{background:var(--mint-soft);}
  .cat-btn.pos .pts{background:var(--mint);color:#fff;}
  .cat-btn.neg{background:var(--pink-soft);}
  .cat-btn.neg .pts{background:var(--pink);color:#fff;}
  .cat-btn:disabled{opacity:0.5;cursor:default;}

  .timeline{display:flex;flex-direction:column;gap:0;}
  .timeline .row{
    display:flex;justify-content:space-between;gap:10px;padding:10px 0;
    border-bottom:1px solid var(--paper-line);font-size:13.5px;
  }
  .timeline .row .cat{font-weight:800;}
  .timeline .row .time{color:var(--ink-soft);font-size:11.5px;}
  .timeline .row .pts{font-weight:800;flex-shrink:0;}
  .timeline .row .pts.pos{color:var(--mint);}
  .timeline .row .pts.neg{color:var(--pink);}
  .timeline .empty{color:var(--ink-soft);font-size:13.5px;text-align:center;padding:20px 0;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}

  .era-banner{
    display:flex;align-items:center;gap:16px;background:var(--card);
    border-radius:20px;padding:16px 20px;margin-bottom:18px;
    box-shadow:0 4px 0 var(--paper-line);border-left:8px solid var(--era-accent, var(--mint));
  }
  .era-banner .era-emoji{font-size:40px;line-height:1;flex-shrink:0;}
  .era-banner .era-info{flex:1;min-width:0;}
  .era-banner .era-name{font-size:19px;font-weight:800;}
  .era-banner .era-score{font-size:13px;color:var(--ink-soft);margin:2px 0 8px;}
  .era-banner .era-track{background:var(--paper);border-radius:20px;height:10px;overflow:hidden;}
  .era-banner .era-fill{height:100%;border-radius:20px;background:var(--era-accent, var(--mint));transition:width 0.5s ease;}
  .era-banner .era-next{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}

  footer{margin-top:30px;text-align:center;color:#C9B9A9;font-size:12px;}

  @media (max-width:560px){
    h1{font-size:26px;}
    nav.tabs button{padding:9px 16px;font-size:14.5px;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="eyebrow">✨ 班級經營</span>
    <h1>加減分紀錄</h1>
    <p>506 · 507 · 508 · 509 · 510　點學生卡片加減分，排行榜即時更新</p>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <div class="toolbar">
    <div class="status" id="statusText">讀取中…</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="refresh" id="bulkAddBtn">🎉 全班加分</button>
      <button class="refresh" id="sortToggleBtn">🏆 排行榜排序</button>
      <button class="refresh" id="resetBtn">♻️ 重置本班分數</button>
      <button class="refresh" id="refreshBtn">🔄 重新整理</button>
    </div>
  </div>

  <section class="panel" id="panel"></section>

  <footer>資料同步至 Google 試算表</footer>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <button class="modal-close" id="modalClose" aria-label="關閉">✕</button>
    <h3 id="modalTitle"></h3>
    <div class="modal-sub" id="modalSub"></div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzXXRYVb8Xwm9kY2HUpykGnMktss2MjDom-pigwFzdtPY3tvbvXu09xPl0-XCwN0CniyQ/exec";

const classes = ["506","507","508","509","510"];
let current = "510";
let sortByRank = false;
let STATE = { students: [], categories: [], records: [] };
let loaded = false;

// 20 eras, one every 50 class-wide points, prehistoric → AI.
const ERAS = [
  { name:"史前時代",     emoji:"🦴", bg:"#EDE3D3", accent:"#8B7355" },
  { name:"石器時代",     emoji:"🪨", bg:"#E2D9CB", accent:"#6E6259" },
  { name:"農業時代",     emoji:"🌾", bg:"#EDE7B8", accent:"#A98B2E" },
  { name:"青銅時代",     emoji:"🏺", bg:"#E3C9A0", accent:"#8C5B2E" },
  { name:"鐵器時代",     emoji:"⚔️", bg:"#D8D3CE", accent:"#5A5854" },
  { name:"古文明時代",   emoji:"🏛️", bg:"#E9DCC3", accent:"#B08D3F" },
  { name:"城邦時代",     emoji:"🏰", bg:"#D9E3E8", accent:"#3E6E80" },
  { name:"帝國時代",     emoji:"👑", bg:"#F1DDBE", accent:"#B8860B" },
  { name:"中世紀",       emoji:"🛡️", bg:"#DCE0E6", accent:"#4A5568" },
  { name:"大航海時代",   emoji:"⛵", bg:"#CDE7EF", accent:"#1F7A99" },
  { name:"文藝復興",     emoji:"🎨", bg:"#F3DDE3", accent:"#B5456D" },
  { name:"工業革命",     emoji:"⚙️", bg:"#DDD6CE", accent:"#6B5B4A" },
  { name:"蒸汽時代",     emoji:"🚂", bg:"#E4D4C3", accent:"#7A4A2B" },
  { name:"電力時代",     emoji:"💡", bg:"#FBEFC2", accent:"#C79B12" },
  { name:"太空時代",     emoji:"🚀", bg:"#D6E0F5", accent:"#3355A8" },
  { name:"電腦時代",     emoji:"🖥️", bg:"#D9EAE6", accent:"#1F7A5E" },
  { name:"網路時代",     emoji:"🌐", bg:"#D3E6F7", accent:"#1B6FA8" },
  { name:"智慧型手機時代", emoji:"📱", bg:"#E6D9F2", accent:"#6B3FA0" },
  { name:"機器人時代",   emoji:"🤖", bg:"#DDE3EA", accent:"#3D5A73" },
  { name:"AI 世代",      emoji:"✨", bg:"#E0F7FA", accent:"#0097A7" }
];
const POINTS_PER_ERA = 50;

function classTotal(cls){
  return STATE.records.filter(r => r.className === cls).reduce((sum, r) => sum + r.points, 0);
}
function eraForScore(score){
  const idx = Math.max(0, Math.min(ERAS.length - 1, Math.floor(Math.max(0, score) / POINTS_PER_ERA)));
  return { idx, era: ERAS[idx] };
}
function applyEraBackground(score){
  const { era } = eraForScore(score);
  document.documentElement.style.setProperty('--paper', era.bg);
}

function statusText(msg){ document.getElementById("statusText").textContent = msg; }

async function loadState(){
  statusText("讀取中…");
  try {
    const res = await fetch(WEBAPP_URL + "?action=state", { cache: "no-store" });
    const data = await res.json();
    STATE = data;
    loaded = true;
    statusText("最後更新：" + new Date().toLocaleTimeString("zh-TW"));
  } catch(e){
    statusText("讀取失敗，請按重新整理再試一次");
  }
  renderTabs();
  renderPanel();
}

function postRecord(student, category){
  // Optimistic update: show the new score immediately, don't wait on the
  // network round trip (Apps Script latency is the bottleneck, not the UI).
  const optimisticRecord = {
    time: new Date().toISOString(),
    className: student.className,
    seat: student.seat,
    name: student.name,
    category: category.name,
    points: category.points,
    note: ""
  };
  STATE.records.push(optimisticRecord);
  renderPanel();
  statusText("送出中…");

  const payload = {
    className: student.className,
    seat: student.seat,
    name: student.name,
    category: category.name,
    points: category.points
  };
  fetch(WEBAPP_URL, { method: "POST", body: JSON.stringify(payload) })
    .then(res => res.json())
    .then(data => {
      STATE = data; // reconcile with server's canonical state
      statusText("已更新：" + new Date().toLocaleTimeString("zh-TW"));
      renderPanel();
    })
    .catch(() => {
      statusText("⚠️ 同步失敗，分數可能沒存到，請按重新整理確認");
    });
}

function studentsInClass(cls){
  return STATE.students.filter(s => s.className === cls);
}
function recordsFor(cls, seat){
  return STATE.records.filter(r => r.className === cls && r.seat === seat);
}
function totalFor(cls, seat){
  return recordsFor(cls, seat).reduce((sum, r) => sum + r.points, 0);
}

function renderTabs(){
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = classes.map(c => `<button data-c="${c}" class="${c===current?'active':''}">${c} 班</button>`).join("");
  tabsEl.querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", ()=>{ current = b.dataset.c; renderTabs(); renderPanel(); });
  });
}

function renderPanel(){
  const panelEl = document.getElementById("panel");
  if (!loaded){
    panelEl.innerHTML = `<div class="empty-state">正在連線 Google 試算表…</div>`;
    return;
  }
  const students = studentsInClass(current);
  if (students.length === 0){
    panelEl.innerHTML = `<div class="empty-state">找不到 ${current} 班的學生名單</div>`;
    return;
  }

  const total = classTotal(current);
  const { idx, era } = eraForScore(total);
  applyEraBackground(total);
  const floor = idx * POINTS_PER_ERA;
  const isMax = idx === ERAS.length - 1;
  const progressPct = isMax ? 100 : Math.max(0, Math.min(100, ((total - floor) / POINTS_PER_ERA) * 100));
  const nextText = isMax
    ? "已經抵達最終時代，太厲害了！"
    : `再 ${floor + POINTS_PER_ERA - total} 分晉級「${ERAS[idx+1].name} ${ERAS[idx+1].emoji}」`;

  const eraBanner = `
    <div class="era-banner" style="--era-accent:${era.accent}">
      <div class="era-emoji">${era.emoji}</div>
      <div class="era-info">
        <div class="era-name">${era.name}</div>
        <div class="era-score">全班積分：${total} 分</div>
        <div class="era-track"><div class="era-fill" style="width:${progressPct}%"></div></div>
        <div class="era-next">${nextText}</div>
      </div>
    </div>
  `;

  const withTotals = students.map(s => ({ ...s, total: totalFor(s.className, s.seat) }));
  if (sortByRank){
    withTotals.sort((a,b) => b.total - a.total || a.seat - b.seat);
  } else {
    withTotals.sort((a,b) => a.seat - b.seat);
  }

  panelEl.innerHTML = eraBanner + `<div class="grid">${withTotals.map((s, i) => {
    const cls = s.total > 0 ? "pos" : (s.total < 0 ? "neg" : "zero");
    const rankBadge = sortByRank ? `<div class="rank">${i+1}</div>` : "";
    return `
      <div class="stu-card">
        ${rankBadge}
        <div class="seat">${s.seat}</div>
        <div class="name">${s.name}</div>
        <div class="total ${cls}">${s.total > 0 ? '+' : ''}${s.total}</div>
        <div class="actions">
          <button class="primary" data-act="add" data-seat="${s.seat}">加減分</button>
          <button data-act="log" data-seat="${s.seat}">紀錄</button>
        </div>
      </div>
    `;
  }).join("")}</div>`;

  panelEl.querySelectorAll('button[data-act="add"]').forEach(b=>{
    b.addEventListener("click", () => openAddModal(current, parseInt(b.dataset.seat, 10)));
  });
  panelEl.querySelectorAll('button[data-act="log"]').forEach(b=>{
    b.addEventListener("click", () => openLogModal(current, parseInt(b.dataset.seat, 10)));
  });
}

function findStudent(cls, seat){
  return STATE.students.find(s => s.className === cls && s.seat === seat);
}

function openModalBase(title, sub){
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalSub").textContent = sub || "";
  document.getElementById("modalOverlay").classList.add("open");
}
function closeModal(){
  document.getElementById("modalOverlay").classList.remove("open");
}

function openAddModal(cls, seat){
  const student = findStudent(cls, seat);
  if (!student) return;
  openModalBase(`${student.name}`, `${cls} 班・座號 ${seat}　目前總分 ${totalFor(cls, seat)}`);
  const body = document.getElementById("modalBody");
  body.innerHTML = `<div class="cat-list">${STATE.categories.map((c,i) => {
    const sign = c.points > 0 ? "pos" : "neg";
    const ptsLabel = c.points > 0 ? `+${c.points}` : `${c.points}`;
    return `<button class="cat-btn ${sign}" data-i="${i}">
      <span>${c.name}</span><span class="pts">${ptsLabel}</span>
    </button>`;
  }).join("")}</div>`;
  body.querySelectorAll(".cat-btn").forEach(btn=>{
    btn.addEventListener("click", () => {
      const cat = STATE.categories[parseInt(btn.dataset.i, 10)];
      closeModal();
      postRecord(student, cat);
    });
  });
}

function openLogModal(cls, seat){
  const student = findStudent(cls, seat);
  if (!student) return;
  openModalBase(`${student.name}的紀錄`, `${cls} 班・座號 ${seat}　目前總分 ${totalFor(cls, seat)}`);
  const records = recordsFor(cls, seat).slice().sort((a,b) => new Date(b.time) - new Date(a.time));
  const body = document.getElementById("modalBody");
  if (records.length === 0){
    body.innerHTML = `<div class="timeline"><div class="empty">還沒有任何紀錄</div></div>`;
    return;
  }
  body.innerHTML = `<div class="timeline">${records.map(r => {
    const sign = r.points > 0 ? "pos" : "neg";
    const ptsLabel = r.points > 0 ? `+${r.points}` : `${r.points}`;
    let timeStr = r.time;
    const d = new Date(r.time);
    if (!isNaN(d)) timeStr = d.toLocaleString("zh-TW", { month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit" });
    return `<div class="row">
      <div><div class="cat">${r.category}</div><div class="time">${timeStr}</div></div>
      <div class="pts ${sign}">${ptsLabel}</div>
    </div>`;
  }).join("")}</div>`;
}

function openBulkAddModal(cls){
  const students = studentsInClass(cls);
  openModalBase(`🎉 全班加分 — ${cls} 班`, `這個名目會套用到全班 ${students.length} 位同學`);
  const body = document.getElementById("modalBody");
  body.innerHTML = `<div class="cat-list">${STATE.categories.map((c,i) => {
    const sign = c.points > 0 ? "pos" : "neg";
    const ptsLabel = c.points > 0 ? `+${c.points}` : `${c.points}`;
    return `<button class="cat-btn ${sign}" data-i="${i}">
      <span>${c.name}</span><span class="pts">${ptsLabel}</span>
    </button>`;
  }).join("")}</div>`;
  body.querySelectorAll(".cat-btn").forEach(btn=>{
    btn.addEventListener("click", () => {
      const cat = STATE.categories[parseInt(btn.dataset.i, 10)];
      closeModal();
      bulkAddRecord(cls, cat);
    });
  });
}

function bulkAddRecord(cls, category){
  const students = studentsInClass(cls);
  const now = new Date().toISOString();
  students.forEach(s => {
    STATE.records.push({
      time: now, className: cls, seat: s.seat, name: s.name,
      category: category.name, points: category.points, note: ""
    });
  });
  renderPanel();
  statusText("送出中…（全班加分）");

  fetch(WEBAPP_URL, { method: "POST", body: JSON.stringify({
    action: "bulkAdd", className: cls, category: category.name, points: category.points
  }) })
    .then(res => res.json())
    .then(data => {
      STATE = data;
      statusText("已更新：" + new Date().toLocaleTimeString("zh-TW"));
      renderPanel();
    })
    .catch(() => {
      statusText("⚠️ 同步失敗，請按重新整理確認");
    });
}

document.getElementById("bulkAddBtn").addEventListener("click", () => openBulkAddModal(current));

document.getElementById("modalClose").addEventListener("click", closeModal);
document.getElementById("modalOverlay").addEventListener("click", (e) => {
  if (e.target.id === "modalOverlay") closeModal();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
document.getElementById("refreshBtn").addEventListener("click", loadState);

document.getElementById("sortToggleBtn").addEventListener("click", (e) => {
  sortByRank = !sortByRank;
  e.target.textContent = sortByRank ? "🔢 座號排序" : "🏆 排行榜排序";
  renderPanel();
});

document.getElementById("resetBtn").addEventListener("click", () => {
  const ok = confirm(`確定要重置 ${current} 班全部學生的分數嗎？\n\n⚠️ 這會永久刪除這個班級「所有」加減分歷史紀錄，無法復原！`);
  if (!ok) return;

  // Optimistic: clear this class's records locally right away.
  STATE.records = STATE.records.filter(r => r.className !== current);
  renderPanel();
  statusText("重置中…");

  fetch(WEBAPP_URL, { method: "POST", body: JSON.stringify({ action: "resetClass", className: current }) })
    .then(res => res.json())
    .then(data => {
      STATE = data;
      statusText("已重置：" + new Date().toLocaleTimeString("zh-TW"));
      renderPanel();
    })
    .catch(() => {
      statusText("⚠️ 重置可能沒有完全同步，請按重新整理確認");
    });
});

renderTabs();
renderPanel();
loadState();
</script>
