<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五年級小考成績總覽</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --paper:#EEF2ED;
    --paper-line:#D3DCD2;
    --ink:#1E2B27;
    --ink-soft:#4B5A54;
    --pen-red:#C4433B;
    --pen-red-soft:#E7B4AE;
    --pen-gold:#D89A34;
    --sage:#5C8A78;
    --sage-soft:#CFE1D7;
    --card:#FBFAF6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 28px 28px;
    color:var(--ink);
    font-family: "Microsoft JhengHei","PingFang TC","Noto Sans TC",-apple-system,sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  .wrap{max-width:920px;margin:0 auto;padding:36px 20px 80px;}

  header{margin-bottom:28px;}
  .eyebrow{
    display:inline-block;
    font-size:13px;
    color:var(--sage);
    border:1.5px solid var(--sage);
    border-radius:3px;
    padding:2px 8px;
    transform:rotate(-2deg);
    margin-bottom:10px;
  }
  h1{
    font-size:32px;
    margin:0 0 6px;
    font-weight:700;
    letter-spacing:0.5px;
  }
  header p{margin:0;color:var(--ink-soft);font-size:14.5px;}

  nav.tabs{
    display:flex;
    gap:6px;
    margin:26px 0 22px;
    border-bottom:2px solid var(--ink);
    flex-wrap:wrap;
  }
  nav.tabs button{
    font-family:inherit;
    font-size:16px;
    font-weight:700;
    background:transparent;
    border:2px solid var(--ink);
    border-bottom:none;
    border-radius:8px 8px 0 0;
    padding:9px 20px 8px;
    cursor:pointer;
    color:var(--ink-soft);
    position:relative;
    top:2px;
  }
  nav.tabs button.active{
    background:var(--card);
    color:var(--ink);
    top:2px;
    border-bottom:2px solid var(--card);
  }
  nav.tabs button .dot{
    display:inline-block;width:7px;height:7px;border-radius:50%;
    margin-right:7px;position:relative;top:-1px;
  }
  nav.tabs button .dot.filled{background:var(--sage);}
  nav.tabs button .dot.empty{background:transparent;border:1.5px solid #B9C2B7;}

  .panel{
    background:var(--card);
    border:2px solid var(--ink);
    border-radius:0 10px 10px 10px;
    padding:28px;
  }

  .panel-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:22px;
  }
  .panel-head h2{margin:0;font-size:22px;}
  .panel-head .sub{color:var(--ink-soft);font-size:13.5px;margin-top:4px;}

  .grade-stamp{
    width:104px;height:104px;
    border:4px solid var(--pen-red);
    border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transform:rotate(-6deg);
    color:var(--pen-red);
    flex-shrink:0;
  }
  .grade-stamp .num{font-size:30px;font-weight:800;line-height:1;}
  .grade-stamp .lbl{font-size:11px;margin-top:2px;letter-spacing:1px;}

  .stat-row{
    display:flex;
    gap:14px;
    margin-bottom:24px;
    flex-wrap:wrap;
  }
  .stat-box{
    background:var(--paper);
    border:1.5px solid var(--paper-line);
    border-radius:8px;
    padding:12px 18px;
    min-width:110px;
  }
  .stat-box .v{font-size:20px;font-weight:800;}
  .stat-box .k{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  .chart-box{
    background:var(--paper);
    border:1.5px solid var(--paper-line);
    border-radius:8px;
    padding:18px 18px 8px;
    margin-bottom:24px;
  }
  .chart-box h3{margin:0 0 12px;font-size:14px;color:var(--ink-soft);font-weight:700;}
  .chart-box .canvas-wrap{position:relative;height:260px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table caption{text-align:left;font-size:14px;color:var(--ink-soft);font-weight:700;margin-bottom:10px;}
  th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--paper-line);}
  th{color:var(--ink-soft);font-weight:700;font-size:12.5px;}
  td.name{text-align:left;}
  td.score{font-weight:700;}
  td.absent{color:#AEB7AC;font-style:italic;}

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty .icon{
    width:64px;height:64px;margin:0 auto 16px;
    border:2px dashed #B9C2B7;
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;
    transform:rotate(-3deg);
  }
  .empty p{margin:4px 0;font-size:14.5px;}
  .empty .small{font-size:12.5px;color:#9AA69A;}

  footer{margin-top:30px;text-align:center;color:#9AA69A;font-size:12px;}

  @media (max-width:560px){
    h1{font-size:26px;}
    .panel{padding:20px;}
    nav.tabs button{padding:8px 14px 7px;font-size:14.5px;}
    .grade-stamp{width:84px;height:84px;}
    .grade-stamp .num{font-size:24px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="eyebrow">小考成績紀錄</span>
    <h1>五年級成績總覽</h1>
    <p>506 · 507 · 508 · 509 · 510　各班分數級距、平均分數統計</p>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <section class="panel" id="panel"></section>

  <footer>資料來源：各班小考成績登錄表</footer>
</div>

<script>
const DATA = {
  "506": { status: "empty" },
  "507": { status: "empty" },
  "508": { status: "empty" },
  "509": { status: "empty" },
  "510": {
    status: "ready",
    average: 76.08,
    submitted: 25,
    total: 27,
    absentSeats: [6, 11],
    distribution: [
      { label: "60以下", count: 5 },
      { label: "60-69", count: 2 },
      { label: "70-79", count: 6 },
      { label: "80-84", count: 3 },
      { label: "85-89", count: 4 },
      { label: "90-94", count: 2 },
      { label: "95-99", count: 2 },
      { label: "100",    count: 1 }
    ],
    students: [
      {seat:1,name:"朱屹凡",score:74},{seat:2,name:"杜有杰",score:68},
      {seat:3,name:"徐冠宥",score:88},{seat:4,name:"張萬鑫",score:86},
      {seat:5,name:"葉佳叡",score:56},{seat:6,name:"田恩睿",score:null},
      {seat:7,name:"張宸緁",score:84},{seat:8,name:"莊仁傑",score:88},
      {seat:9,name:"陳裕緯",score:76},{seat:10,name:"王允泓",score:88},
      {seat:11,name:"歐與光",score:null},{seat:12,name:"陳宥言",score:100},
      {seat:13,name:"范祐鎧",score:78},{seat:14,name:"李浚睿",score:80},
      {seat:15,name:"林筠扉",score:96},{seat:16,name:"羅御瑄",score:56},
      {seat:17,name:"李凱莉",score:72},{seat:18,name:"鄭琹云",score:96},
      {seat:19,name:"黃楷樂",score:72},{seat:20,name:"錢忻菲",score:54},
      {seat:21,name:"卓芮巧",score:82},{seat:22,name:"何依諦",score:90},
      {seat:23,name:"蕭歆芸",score:92},{seat:24,name:"盧玟慈",score:48},
      {seat:25,name:"張宸菲",score:72},{seat:26,name:"黃亮恩",score:46},
      {seat:27,name:"劉霈青",score:60}
    ]
  }
};

const classes = ["506","507","508","509","510"];
let current = "510";
let chartInstance = null;

const tabsEl = document.getElementById("tabs");
const panelEl = document.getElementById("panel");

function renderTabs(){
  tabsEl.innerHTML = classes.map(c => {
    const ready = DATA[c].status === "ready";
    return `<button data-c="${c}" class="${c===current?'active':''}">
      <span class="dot ${ready?'filled':'empty'}"></span>${c} 班
    </button>`;
  }).join("");
  tabsEl.querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", ()=>{ current = b.dataset.c; renderTabs(); renderPanel(); });
  });
}

function renderPanel(){
  const d = DATA[current];

  if (chartInstance){ chartInstance.destroy(); chartInstance = null; }

  if (d.status !== "ready"){
    panelEl.innerHTML = `
      <div class="panel-head">
        <div>
          <h2>${current} 班</h2>
          <div class="sub">尚未登錄成績</div>
        </div>
      </div>
      <div class="empty">
        <div class="icon">?</div>
        <p>這個班級還沒有小考成績資料。</p>
        <p class="small">登錄後，這裡會自動出現分數級距、平均分數與統計圖表。</p>
      </div>
    `;
    return;
  }

  const submittedCount = d.students.filter(s => s.score !== null).length;

  panelEl.innerHTML = `
    <div class="panel-head">
      <div>
        <h2>${current} 班</h2>
        <div class="sub">1-1 小考 · 共 ${d.total} 人 · 已收 ${submittedCount} 份 · 缺考 ${d.absentSeats.length} 人（座號 ${d.absentSeats.join("、")}）</div>
      </div>
      <div class="grade-stamp">
        <div class="num">${d.average}</div>
        <div class="lbl">班平均</div>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-box"><div class="v">${d.average}</div><div class="k">平均分數</div></div>
      <div class="stat-box"><div class="v">${d.distribution.find(x=>x.label==="100")?.count ?? 0}</div><div class="k">滿分人數</div></div>
      <div class="stat-box"><div class="v">${d.distribution.find(x=>x.label==="60以下")?.count ?? 0}</div><div class="k">60分以下</div></div>
      <div class="stat-box"><div class="v">${submittedCount}</div><div class="k">實際應試人數</div></div>
    </div>

    <div class="chart-box">
      <h3>1-1 小考｜分數級距人數分布</h3>
      <div class="canvas-wrap"><canvas id="distChart"></canvas></div>
    </div>

    <table>
      <caption>1-1 小考｜分數級距統計</caption>
      <thead><tr><th>級距</th><th>人數</th></tr></thead>
      <tbody>
        ${d.distribution.map(x => `
          <tr>
            <td>${x.label}</td>
            <td class="score">${x.count}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;

  const ctx = document.getElementById("distChart").getContext("2d");
  chartInstance = new Chart(ctx, {
    type: "bar",
    data: {
      labels: d.distribution.map(x=>x.label),
      datasets: [{
        data: d.distribution.map(x=>x.count),
        backgroundColor: "#5C8A78",
        borderRadius: 4,
        maxBarThickness: 46
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero:true, ticks:{ stepSize:1, color:"#4B5A54" }, grid:{ color:"#D3DCD2" } },
        x: { ticks:{ color:"#4B5A54" }, grid:{ display:false } }
      }
    }
  });
}

renderTabs();
renderPanel();
</script>
</body>
</html>
