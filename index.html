<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五年級小考成績總覽</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --paper:#EEF2ED;
    --paper-line:#D3DCD2;
    --ink:#1E2B27;
    --ink-soft:#4B5A54;
    --pen-red:#C4433B;
    --pen-red-soft:#E7B4AE;
    --pen-gold:#D89A34;
    --sage:#5C8A78;
    --sage-soft:#CFE1D7;
    --card:#FBFAF6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 28px 28px;
    color:var(--ink);
    font-family: "Microsoft JhengHei","PingFang TC","Noto Sans TC",-apple-system,sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  .wrap{max-width:920px;margin:0 auto;padding:36px 20px 80px;}

  header{margin-bottom:28px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .eyebrow{
    display:inline-block;
    font-size:13px;
    color:var(--sage);
    border:1.5px solid var(--sage);
    border-radius:3px;
    padding:2px 8px;
    transform:rotate(-2deg);
    margin-bottom:10px;
  }
  h1{
    font-size:32px;
    margin:0 0 6px;
    font-weight:700;
    letter-spacing:0.5px;
  }
  header p{margin:0;color:var(--ink-soft);font-size:14.5px;}

  .refresh-note{
    font-size:12.5px;
    color:var(--ink-soft);
    border:1.5px dashed #B9C2B7;
    border-radius:8px;
    padding:8px 12px;
    max-width:220px;
  }

  nav.tabs{
    display:flex;
    gap:6px;
    margin:26px 0 22px;
    border-bottom:2px solid var(--ink);
    flex-wrap:wrap;
  }
  nav.tabs button{
    font-family:inherit;
    font-size:16px;
    font-weight:700;
    background:transparent;
    border:2px solid var(--ink);
    border-bottom:none;
    border-radius:8px 8px 0 0;
    padding:9px 20px 8px;
    cursor:pointer;
    color:var(--ink-soft);
    position:relative;
    top:2px;
  }
  nav.tabs button.active{
    background:var(--card);
    color:var(--ink);
    top:2px;
    border-bottom:2px solid var(--card);
  }
  nav.tabs button .dot{
    display:inline-block;width:7px;height:7px;border-radius:50%;
    margin-right:7px;position:relative;top:-1px;
  }
  nav.tabs button .dot.filled{background:var(--sage);}
  nav.tabs button .dot.empty{background:transparent;border:1.5px solid #B9C2B7;}
  nav.tabs button .dot.error{background:var(--pen-red);}

  .panel{
    background:var(--card);
    border:2px solid var(--ink);
    border-radius:0 10px 10px 10px;
    padding:28px;
  }

  .panel-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:22px;
  }
  .panel-head h2{margin:0;font-size:22px;}
  .panel-head .sub{color:var(--ink-soft);font-size:13.5px;margin-top:4px;}

  .grade-stamp{
    width:104px;height:104px;
    border:4px solid var(--pen-red);
    border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transform:rotate(-6deg);
    color:var(--pen-red);
    flex-shrink:0;
  }
  .grade-stamp .num{font-size:30px;font-weight:800;line-height:1;}
  .grade-stamp .lbl{font-size:11px;margin-top:2px;letter-spacing:1px;}

  .stat-row{
    display:flex;
    gap:14px;
    margin-bottom:24px;
    flex-wrap:wrap;
  }
  .stat-box{
    background:var(--paper);
    border:1.5px solid var(--paper-line);
    border-radius:8px;
    padding:12px 18px;
    min-width:110px;
  }
  .stat-box .v{font-size:20px;font-weight:800;}
  .stat-box .k{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  .chart-box{
    background:var(--paper);
    border:1.5px solid var(--paper-line);
    border-radius:8px;
    padding:18px 18px 8px;
    margin-bottom:24px;
  }
  .chart-box h3{margin:0 0 12px;font-size:14px;color:var(--ink-soft);font-weight:700;}
  .chart-box .canvas-wrap{position:relative;height:260px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table caption{text-align:left;font-size:14px;color:var(--ink-soft);font-weight:700;margin-bottom:10px;}
  th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--paper-line);}
  th{color:var(--ink-soft);font-weight:700;font-size:12.5px;}
  td.score{font-weight:700;}

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty .icon{
    width:64px;height:64px;margin:0 auto 16px;
    border:2px dashed #B9C2B7;
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;
    transform:rotate(-3deg);
  }
  .empty .icon.error{border-color:var(--pen-red-soft);color:var(--pen-red);}
  .empty p{margin:4px 0;font-size:14.5px;}
  .empty .small{font-size:12.5px;color:#9AA69A;}

  footer{margin-top:30px;text-align:center;color:#9AA69A;font-size:12px;}

  @media (max-width:560px){
    h1{font-size:26px;}
    .panel{padding:20px;}
    nav.tabs button{padding:8px 14px 7px;font-size:14.5px;}
    .grade-stamp{width:84px;height:84px;}
    .grade-stamp .num{font-size:24px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <span class="eyebrow">小考成績紀錄</span>
      <h1>五年級成績總覽</h1>
      <p>506 · 507 · 508 · 509 · 510　各班分數級距、平均分數統計</p>
    </div>
    <div class="refresh-note">資料即時讀取自 Google 試算表，重新整理網頁即可看到最新成績。</div>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <section class="panel" id="panel"></section>

  <footer>資料來源：各班小考成績登錄表（Google 試算表）</footer>
</div>

<script>
// Each class's Google Sheet file ID. The first tab (left-most) of each
// spreadsheet is read — for classes where the teacher has added a
// "級距統計" style first tab (distribution rows + a 平均分數 row), the
// numbers are parsed straight from it. Classes without that tab yet show
// as "尚未登錄成績".
const SHEETS = {
  "506": "1cVKZhT1VVkY6YyRpIoQgV2VLWB5bSGbjxzyfMANr6_U",
  "507": "1tSYPfo_XuHjV4YP5FnE7f8PtL7AmpwNwE3T50yKvfzU",
  "508": "1ivtw3RfcXy0svcfrPV_7agerNlRMq4TJOO3S60fhTiU",
  "509": "1UIv5L5CrNQEEtUrN4jgYN_iC8rbO9VTjEp8EmWx2_-o",
  "510": "19fwrgcsWUbxeMnB1KRBcEMu4z5xNM5cpVGMqbkgflc4"
};

const classes = Object.keys(SHEETS);
let current = "510";
let chartInstance = null;
const STATE = {}; // classCode -> { status: 'loading'|'ready'|'empty'|'error', average, distribution }

classes.forEach(c => STATE[c] = { status: "loading" });

function csvUrl(fileId){
  return `https://docs.google.com/spreadsheets/d/${fileId}/gviz/tq?tqx=out:csv`;
}

function parseStatsCsv(text){
  const parsed = Papa.parse(text.trim(), { skipEmptyLines: false });
  const rows = parsed.data;
  let average = null;
  const distribution = [];
  for (const row of rows){
    if (!row || row.length < 2) continue;
    const label = (row[0] || "").toString().trim();
    const raw = (row[1] || "").toString().trim();
    if (!label) continue;
    if (label === "平均分數"){
      const v = parseFloat(raw);
      if (!isNaN(v)) average = v;
      continue;
    }
    const looksLikeBucket = /^\d+$/.test(label) || /^\d+-\d+$/.test(label) || label.includes("以下") || label.includes("以上");
    const count = parseInt(raw, 10);
    if (looksLikeBucket && !isNaN(count)){
      distribution.push({ label, count });
    }
  }
  if (average === null || distribution.length === 0) return null;
  // Sheet stores buckets high-to-low; display low-to-high (left = low score).
  distribution.reverse();
  return { average, distribution };
}

async function loadClass(c){
  try {
    const res = await fetch(csvUrl(SHEETS[c]), { cache: "no-store" });
    if (!res.ok) throw new Error("fetch failed");
    const text = await res.text();
    const parsed = parseStatsCsv(text);
    if (!parsed){
      STATE[c] = { status: "empty" };
    } else {
      STATE[c] = { status: "ready", average: parsed.average, distribution: parsed.distribution };
    }
  } catch (e){
    STATE[c] = { status: "error" };
  }
  renderTabs();
  if (c === current) renderPanel();
}

function renderTabs(){
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = classes.map(c => {
    const s = STATE[c].status;
    const dotClass = s === "ready" ? "filled" : (s === "error" ? "error" : "empty");
    return `<button data-c="${c}" class="${c===current?'active':''}">
      <span class="dot ${dotClass}"></span>${c} 班
    </button>`;
  }).join("");
  tabsEl.querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", ()=>{ current = b.dataset.c; renderTabs(); renderPanel(); });
  });
}

function renderPanel(){
  const panelEl = document.getElementById("panel");
  const d = STATE[current];

  if (chartInstance){ chartInstance.destroy(); chartInstance = null; }

  if (d.status === "loading"){
    panelEl.innerHTML = `
      <div class="panel-head"><div><h2>${current} 班</h2><div class="sub">讀取中…</div></div></div>
      <div class="empty"><div class="icon">…</div><p>正在從試算表讀取最新成績。</p></div>
    `;
    return;
  }

  if (d.status === "error"){
    panelEl.innerHTML = `
      <div class="panel-head"><div><h2>${current} 班</h2><div class="sub">讀取失敗</div></div></div>
      <div class="empty">
        <div class="icon error">!</div>
        <p>沒辦法讀取這個班級的試算表。</p>
        <p class="small">請確認該試算表的共用設定是「知道連結的人可以檢視」。</p>
      </div>
    `;
    return;
  }

  if (d.status === "empty"){
    panelEl.innerHTML = `
      <div class="panel-head"><div><h2>${current} 班</h2><div class="sub">尚未登錄成績</div></div></div>
      <div class="empty">
        <div class="icon">?</div>
        <p>這個班級還沒有小考成績統計資料。</p>
        <p class="small">登錄後，這裡會自動出現分數級距、平均分數與統計圖表。</p>
      </div>
    `;
    return;
  }

  const submittedCount = d.distribution.reduce((sum, x) => sum + x.count, 0);
  const topCount = d.distribution.find(x => x.label === "100")?.count ?? 0;
  const belowCount = d.distribution.find(x => x.label.includes("以下"))?.count ?? 0;

  panelEl.innerHTML = `
    <div class="panel-head">
      <div>
        <h2>${current} 班</h2>
        <div class="sub">1-1 小考 · 已收 ${submittedCount} 份</div>
      </div>
      <div class="grade-stamp">
        <div class="num">${d.average}</div>
        <div class="lbl">班平均</div>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-box"><div class="v">${d.average}</div><div class="k">平均分數</div></div>
      <div class="stat-box"><div class="v">${topCount}</div><div class="k">滿分人數</div></div>
      <div class="stat-box"><div class="v">${belowCount}</div><div class="k">60分以下</div></div>
      <div class="stat-box"><div class="v">${submittedCount}</div><div class="k">實際應試人數</div></div>
    </div>

    <div class="chart-box">
      <h3>1-1 小考｜分數級距人數分布</h3>
      <div class="canvas-wrap"><canvas id="distChart"></canvas></div>
    </div>

    <table>
      <caption>1-1 小考｜分數級距統計</caption>
      <thead><tr><th>級距</th><th>人數</th></tr></thead>
      <tbody>
        ${d.distribution.map(x => `
          <tr>
            <td>${x.label}</td>
            <td class="score">${x.count}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;

  const ctx = document.getElementById("distChart").getContext("2d");
  chartInstance = new Chart(ctx, {
    type: "bar",
    data: {
      labels: d.distribution.map(x=>x.label),
      datasets: [{
        data: d.distribution.map(x=>x.count),
        backgroundColor: "#5C8A78",
        borderRadius: 4,
        maxBarThickness: 46
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero:true, ticks:{ stepSize:1, color:"#4B5A54" }, grid:{ color:"#D3DCD2" } },
        x: { ticks:{ color:"#4B5A54" }, grid:{ display:false } }
      }
    }
  });
}

renderTabs();
renderPanel();
classes.forEach(loadClass);
</script>
</body>
</html>
